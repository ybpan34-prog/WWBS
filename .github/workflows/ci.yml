name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: unittest / Python 3.13
    # app.py 模块级 import tkinter，windows_client.py 依赖 ctypes.wintypes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      # tests/ 不是包，-t 需指向 tests 自身，并用 PYTHONPATH 暴露仓库根
      - name: 运行单元测试
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python scripts/run_tests.py

  lint:
    name: ruff
    # 静态检查与操作系统无关
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      # 检查结论以 ruff.toml 加此版本为准
      - name: 安装 ruff
        run: pip install ruff==0.16.8

      - name: 静态检查
        run: ruff check .

  package:
    name: pyinstaller / windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip

      - name: 安装依赖与打包工具
        run: pip install -r requirements.txt pyinstaller==6.22.3

      # spec 里 upx=True；runner 无 UPX 时 PyInstaller 跳过，不影响构建
      - name: 打包
        run: pyinstaller --noconfirm wwbs.spec

      # 断言 spec 的 datas 覆盖了全部运行时资源
      - name: 校验产物资源
        shell: bash
        run: |
          set -euo pipefail
          test -f dist/wwbs/wwbs.exe
          missing=0
          for item in \
            templates/menu1.png \
            templates/daily/zone_hukou_shanmai.png \
            templates/match3/green.png \
            templates/match3/rainbow.png \
            templates/4c/absorb_prompt.png \
            templates/群声共振模拟域/start_simulation.png \
            weekly_tasks.json \
            wwbs.ico \
            assets/run-notice/weekly-start.jpg \
            pet-assets/pink-lace-chibi/frames \
            pet-assets/aemeath-chibi/frames-sharp \
            pet-assets/jingran-chibi/frames \
            pet-assets/jingran-chibi/spritesheet.webp \
            pet-assets/cartethyia-chibi/frames \
            pet-assets/cartethyia-chibi/spritesheet.webp \
            optional-themes/cartethyia-theme.wwbstheme ; do
            if [ ! -e "dist/wwbs/_internal/$item" ]; then
              echo "::error::打包产物缺少资源: $item"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "产物资源校验通过"

      # 主窗口标题非空即 GUI 完成初始化
      - name: 冒烟启动
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "dist\wwbs\wwbs.exe" -PassThru
          try {
            $title = ""
            for ($i = 0; $i -lt 30 -and -not $title; $i++) {
              Start-Sleep -Seconds 1
              if ($proc.HasExited) { throw "wwbs.exe 启动后立即退出，exit code=$($proc.ExitCode)" }
              $proc.Refresh()
              $title = $proc.MainWindowTitle
            }
            if (-not $title) { throw "30 秒内未取得主窗口标题，GUI 未完成初始化" }
            Write-Host "主窗口标题: $title"
            if ($title -notmatch "wwbs") { throw "主窗口标题不含 wwbs：$title" }
            Write-Host "冒烟启动通过"
          } finally {
            if (-not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            }
          }
